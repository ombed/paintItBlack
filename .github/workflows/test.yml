name: test

# Every PR and every push to main: the Node suites, the browser checks,
# and the deterministic benchmark. The model-on benchmark is not here
# (it downloads the weights); run `npm run bench` by hand for that.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Node suites and browser checks
        run: npm test
      - name: Benchmark, deterministic layers
        run: npm run bench:nomodel
      - name: Recall gate (report only)
        run: node bench/gate.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
